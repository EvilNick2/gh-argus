name: release-please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with GITHUB_TOKEN does not start the release workflow, so the
  # binaries are built here and uploaded to the release release-please made.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag }}
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
          release_tag: ${{ needs.release-please.outputs.tag }}
