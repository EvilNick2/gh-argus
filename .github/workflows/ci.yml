name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]
          then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: test with race detector
        if: runner.os == 'Linux'
        run: go test -race -timeout 120s ./...
      - name: test
        if: runner.os == 'Windows'
        run: go test -timeout 120s ./...
