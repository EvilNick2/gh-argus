name: ci

on:
  push:
    branches:
      - dev
  # PRs into main are only the promote PR, already tested by the push to dev,
  # and the release PR. Both are opened by github-actions, so a trigger here
  # waits for a manual approval.
  pull_request:
    branches:
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]
          then
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: test with race detector
        if: runner.os == 'Linux'
        run: go test -race -timeout 120s ./...
      - name: test
        if: runner.os == 'Windows'
        run: go test -timeout 120s ./...
